config_name: yolo11_h23
model_name: yolo
hyperparameters:
  model_weights: yolo11n.pt
  epochs: 50
  imgsz: 640
  batch: 32
  device: "0"
  amp: true
  optimizer: MuSGD  # pin the current effective Ultralytics auto default
  lr0: 0.01         # explicit so learning-rate sensitivity runs take effect
  momentum: 0.9
  warmup_bias_lr: 0.0
  weight_decay: 0.0005
  mosaic: 1.0
coco_json: ../data/h23/instances_merged.json
split_json: ../data/h23/split.json
images_dir: ../data/h23/images
output_dir: ../outputs
wandb_project: bird-detection
wandb_entity: gatech-birdlab
