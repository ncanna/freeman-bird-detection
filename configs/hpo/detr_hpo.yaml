# DETR Optuna study configuration
# model_weights names any HuggingFace object-detection checkpoint. Vanilla DETR
# converges slowly (the paper trains 300-500 epochs), so a short study will
# mostly compare under-trained models; SenseTime/deformable-detr converges faster.
model_name: detr
model_weights: facebook/detr-resnet-50
metric: map50_95

# Canonical data inputs shared by every trial to generate ExperimentConfigs
coco_json: data/h23/instances_subset.json
images_dir: data/h23/images
split_json: data/h23/split_h23_subset.json
output_dir: outputs
wandb_project: bird-detection
random_seed: 42

# Optuna arguments
study_args:  # kwargs that will be passed into optuna.create_study
  study_name: detr_hpo
  direction: maximize
  sampler: TPE  # Note: default n_startup_trials=10
  pruner: median  # the adapter validates every epoch and reports val/mAP50_95
  storage: ~
optimize_args:  # kwargs that will be passed into optuna.study.optimize
  # MedianPruner does nothing until n_startup_trials (Optuna default: 5) trials
  # have completed, so a 4-trial study would never prune.
  n_trials: 8
  timeout: ~

# Hyperparameter search space
hyperparameters:
  static:
    epochs: 50
    imgsz: 640          # short side; long side defaults to imgsz * 16/9
    device: "0"
    lr_step_size: 40
    lr_gamma: 0.1
    clip_max_norm: 0.1
    eval_score_threshold: 0.001  # keep low or AP is understated
  categorical:
    batch: [2, 4, 8]
  int:
  float:
    lr:  # transformer + heads
      - 0.00001
      - 0.001
      - log: True
    lr_backbone:  # pretrained CNN backbone, conventionally ~10x smaller than lr
      - 0.000001
      - 0.0001
      - log: True
    weight_decay:
      - 0.00001
      - 0.001
      - log: True
