# RT-DETR-L H23 Optuna study informed by the July 2026 OFAT sensitivity results.
model_name: rtdetr
model_weights: rtdetr-l.pt
metric: map50_95

coco_json: data/h23/instances_merged.json
images_dir: data/h23/images
split_json: data/h23/split.json
output_dir: outputs
wandb_project: bird-detection
wandb_entity: gatech-birdlab
wandb_tags: [h23, rtdetr, sensitivity-informed]
random_seed: 42

study_args:
  study_name: h23_rtdetr_hpo
  direction: maximize
  sampler: TPE
  pruner: Hyperband
  storage: ~
optimize_args:
  n_trials: 24
  timeout: 46800  # 13 hours; leaves headroom in the 16-hour SLURM allocation

hyperparameters:
  static:
    epochs: 50
    imgsz: 640
    batch: 32
    device: "0"
    amp: true
    optimizer: AdamW
    momentum: 0.9
    warmup_epochs: 3.0
    warmup_bias_lr: 0.0
    # Two completed sensitivity runs favored disabling mosaic. The still-running
    # mosaic=0.5 replacement is intentionally not used to bound this first study.
    mosaic: 0.0
    close_mosaic: 10
    seed: 0
  categorical:
    cos_lr: [false, true]
  int: {}
  float:
    lr0:
      - 0.00001
      - 0.0001
      - log: true
    weight_decay:
      - 0.00005
      - 0.001
      - log: true
    lrf:
      - 0.001
      - 0.03
      - log: true
    scale:
      - 0.1
      - 0.5
